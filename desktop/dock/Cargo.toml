[package]
name = "threadbear-dock"
version = "0.1.0"
description = "BearDock for GPUI: dockable, rearrangeable panels with torn-out windows, like the Swift original in dock/"
edition = "2021"
publish = false

[dependencies]
threadbear-dock-layout = { path = "layout" }
# The same exact version as desktop/gpui: gpui-kit is young, so upgrades are
# done on purpose.
gpui-kit = "=0.9.0"
serde_json = "1"
# Never compiled, like desktop/gpui's: the `automation` feature resolves
# gpui-fast (a gpui-kit test helper's dependency) even though nothing builds
# it, and it pins these exact versions. Remove with gpui-kit's next bump.
taffy = { version = "=0.15.0", optional = true }
unicode-properties = { version = "=0.1.3", optional = true }

# For moving a torn-out window with the pointer and fading it, which GPUI has
# no API for (see src/platform.rs). The exact version GPUI's Mac backend uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
raw-window-handle = "=0.6.2"

[features]
# The demo's scripted control and screenshots (src/bin/dock-demo.rs), like
# desktop/gpui's `automation`: test helpers that really exercise the window.
# Never in a release.
automation = ["gpui-kit/test-support"]

[[bin]]
name = "dock-demo"
path = "src/bin/dock-demo/main.rs"

# Headless runs of the real views and hit testing (gpui_kit::test). Run with
# `cargo test -p threadbear-dock --features automation --test press`.
[[test]]
name = "press"
path = "tests/press.rs"
required-features = ["automation"]
